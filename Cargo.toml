[package]
name = "ego-lite-bridge"
version = "0.1.0"
edition = "2021"
description = "Headless reverse remote exec bridge for ego-browser"
repository = "https://github.com/imleon/ego-lite-bridge"
license = "Apache-2.0"
categories = ["command-line-utilities"]
include = [
    "src/main.rs",
    "src/ego_bridge.rs",
    "src/framing.rs",
    "src/ipc.rs",
    "src/managed_ssh.rs",
    "src/macos_process.rs",
    "tests/fixtures/ego_bridge_v1.bin",
    "distribution/install.sh",
    "LICENSE",
    "Cargo.toml",
]

[dependencies]
bincode = { version = "2", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
