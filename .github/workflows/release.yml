name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from Cargo.toml (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and project gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Report source context
        run: |
          printf 'requested ref: %s\n' "$GITHUB_REF"
          printf 'requested sha: %s\n' "$GITHUB_SHA"
          printf 'checked out commit: '
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Match Cargo package version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as cargo_toml:
              cargo_version = tomllib.load(cargo_toml)["package"]["version"]
          if os.environ["VERSION"] != cargo_version:
              raise SystemExit(
                  f"input version {os.environ['VERSION']!r} does not match Cargo.toml {cargo_version!r}"
              )
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          components: rustfmt,clippy

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: release-check

      - name: Run project gate
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          python3 -m unittest scripts.test_unix_installer scripts.test_prepare_release

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            runner_arch: x86_64
            binary_arch: 'ELF 64-bit LSB.*x86-64'
          - target: macos-aarch64
            rust_target: aarch64-apple-darwin
            runner: macos-15
            runner_arch: arm64
            binary_arch: 'Mach-O 64-bit executable arm64'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          uname -a

      - name: Install Linux build tools
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools binutils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1

      - name: Install release target
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: rustup target add "$RUST_TARGET"

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: release-${{ matrix.target }}

      - name: Test Linux release target
        if: matrix.target == 'linux-x86_64'
        run: cargo test --locked --target ${{ matrix.rust_target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.rust_target }}

      - name: Stage and verify release asset
        env:
          EXPECTED_BINARY_ARCH: ${{ matrix.binary_arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          candidate="ego-lite-bridge-${{ matrix.target }}"
          install -m 755 "target/$RUST_TARGET/release/ego-lite-bridge" "$candidate"
          file "$candidate"
          file "$candidate" | grep -E "$EXPECTED_BINARY_ARCH"

      - name: Verify static Linux candidate
        if: matrix.target == 'linux-x86_64'
        run: |
          candidate=ego-lite-bridge-linux-x86_64
          readelf -lW "$candidate" > program-headers.txt
          readelf -dW "$candidate" > dynamic-section.txt
          readelf -aW "$candidate" > elf-details.txt
          if grep ' INTERP ' program-headers.txt >/dev/null; then
            echo 'Linux candidate has a program interpreter' >&2
            exit 1
          fi
          if grep '(NEEDED)' dynamic-section.txt >/dev/null; then
            echo 'Linux candidate has dynamic dependencies' >&2
            exit 1
          fi
          if grep 'GLIBC_' elf-details.txt >/dev/null; then
            echo 'Linux candidate has a GLIBC version requirement' >&2
            exit 1
          fi

      - name: Smoke Linux candidate on glibc 2.31
        if: matrix.target == 'linux-x86_64'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm --volume "$PWD:/work:ro" ubuntu:20.04 sh -c '
            test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.31"
            test "$(/work/ego-lite-bridge-linux-x86_64 --version)" = "ego-lite-bridge $1"
          ' sh "$VERSION"

      - name: Upload release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ego-lite-bridge-${{ matrix.target }}
          path: ego-lite-bridge-${{ matrix.target }}
          if-no-files-found: error

  bundle:
    name: Prepare release bundle
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: artifacts

      - name: Prepare candidate bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir release-bundle
          install -m 755 artifacts/ego-lite-bridge-linux-x86_64/ego-lite-bridge-linux-x86_64 release-bundle/ego-lite-bridge-linux-x86_64
          install -m 755 artifacts/ego-lite-bridge-macos-aarch64/ego-lite-bridge-macos-aarch64 release-bundle/ego-lite-bridge-macos-aarch64
          python3 scripts/prepare_release.py \
            "$VERSION" \
            release-bundle/ego-lite-bridge-linux-x86_64 \
            release-bundle/ego-lite-bridge-macos-aarch64 \
            > latest.json
          (
            cd release-bundle
            sha256sum ego-lite-bridge-linux-x86_64 ego-lite-bridge-macos-aarch64 > SHA256SUMS
          )
          cp LICENSE latest.json release-bundle/
          tar -czf release-bundle.tar.gz release-bundle
          tar -tvzf release-bundle.tar.gz

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: |
            release-bundle.tar.gz
            release-bundle/ego-lite-bridge-linux-x86_64
            release-bundle/ego-lite-bridge-macos-aarch64
            release-bundle/SHA256SUMS
            release-bundle/LICENSE
            latest.json
          if-no-files-found: error
